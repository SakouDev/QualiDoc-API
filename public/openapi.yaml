openapi: 3.0.3
info:
  title: QualiDoc API
  description: API de prise de rendez-vous médicaux (test technique QualiJob).
  version: "1.0"
servers:
  - url: http://localhost:8080/api
    description: Dev local

tags:
  - name: Auth
    description: Inscription, connexion, token JWT
  - name: Medecins
    description: Recherche de médecins et liste des spécialités
  - name: Admin - Médecins
    description: Créer/modifier/supprimer un médecin (réservé aux comptes admin)
  - name: Admin - Spécialités
    description: Créer/modifier/supprimer une spécialité (réservé aux comptes admin)
  - name: Rendez-vous
    description: Prise de rendez-vous, historique et annulation (patient connecté)
  - name: Admin - Rendez-vous
    description: Visualisation de tous les rendez-vous avec filtres (réservé aux comptes admin)
  - name: Admin - Disponibilités
    description: Déclarer les créneaux disponibles d'un médecin (réservé aux comptes admin)

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Créer un compte patient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Compte créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Erreur de validation (email déjà utilisé, champs manquants...)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      tags: [Auth]
      summary: Se connecter et obtenir un token JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Connexion réussie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Identifiants invalides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /me:
    get:
      tags: [Auth]
      summary: Récupérer le profil du patient connecté
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profil du patient
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
        '401':
          description: Token manquant, invalide ou expiré
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /medecins:
    get:
      tags: [Medecins]
      summary: Rechercher des médecins (nom/prénom + spécialité)
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          description: Recherche plein texte sur nom, prénom et spécialité (préfixe par mot, tous les mots combinés en ET)
          schema:
            type: string
          example: jean dur
      responses:
        '200':
          description: Liste des médecins correspondants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Medecin'
        '401':
          description: Token manquant, invalide ou expiré
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /medecins/{id}/creneaux:
    get:
      tags: [Medecins]
      summary: Lister les créneaux d'un médecin pour une date (disponible/pris)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: date
          in: query
          required: true
          description: Format Y-m-d
          schema:
            type: string
          example: "2026-10-10"
      responses:
        '200':
          description: Liste des créneaux (vide si aucune disponibilité déclarée ce jour-là)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Creneau'
        '400':
          description: Paramètre date manquant ou mal formaté
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Médecin introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /specialites:
    get:
      tags: [Medecins]
      summary: Lister les spécialités
      responses:
        '200':
          description: Liste des spécialités
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Specialite'

  /rendez-vous:
    post:
      tags: [Rendez-vous]
      summary: Prendre un rendez-vous
      description: >
        Format d'échange front → API pour date_heure : `Y-m-d H:i:s`
        (ex: "2026-10-01 10:00:00"), doit être dans le futur.
        Le patient est déduit du token, pas du body.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RendezVousRequest'
      responses:
        '201':
          description: Rendez-vous créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RendezVous'
        '400':
          description: Erreur de validation (médecin inexistant, date passée, format invalide...)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Ce créneau est déjà pris pour ce médecin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags: [Rendez-vous]
      summary: Lister mes rendez-vous (historique + à venir)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Liste des rendez-vous du patient connecté, du plus récent au plus ancien
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RendezVous'

  /rendez-vous/{id}:
    delete:
      tags: [Rendez-vous]
      summary: Annuler un rendez-vous
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Rendez-vous annulé (statut passé à "annule")
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RendezVous'
        '404':
          description: Rendez-vous introuvable (ou n'appartenant pas au patient connecté)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Ce rendez-vous n'est plus annulable (déjà annulé ou honoré)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/rendez-vous:
    get:
      tags: [Admin - Rendez-vous]
      summary: Lister tous les rendez-vous, avec filtres
      security:
        - bearerAuth: []
      parameters:
        - name: medecin_id
          in: query
          schema:
            type: integer
        - name: patient_id
          in: query
          schema:
            type: integer
        - name: statut
          in: query
          schema:
            type: string
            enum: [confirme, annule, honore]
        - name: date_from
          in: query
          description: Format Y-m-d H:i:s
          schema:
            type: string
        - name: date_to
          in: query
          description: Format Y-m-d H:i:s
          schema:
            type: string
      responses:
        '200':
          description: Liste des rendez-vous correspondants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RendezVous'
        '400':
          description: date_from ou date_to mal formaté
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/disponibilites:
    get:
      tags: [Admin - Disponibilités]
      summary: Lister les disponibilités déclarées pour un médecin
      security:
        - bearerAuth: []
      parameters:
        - name: medecin_id
          in: query
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Liste des disponibilités
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Disponibilite'
    post:
      tags: [Admin - Disponibilités]
      summary: Déclarer une plage de disponibilité pour un médecin
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisponibiliteRequest'
      responses:
        '201':
          description: Disponibilité créée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Disponibilite'
        '400':
          description: Erreur de validation (médecin inexistant, heure_fin avant heure_debut...)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/disponibilites/{id}:
    delete:
      tags: [Admin - Disponibilités]
      summary: Supprimer une disponibilité
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Disponibilité supprimée
        '404':
          description: Disponibilité introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/medecins:
    post:
      tags: [Admin - Médecins]
      summary: Créer un médecin
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MedecinRequest'
      responses:
        '201':
          description: Médecin créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Medecin'
        '400':
          description: Erreur de validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Compte non admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/medecins/{id}:
    patch:
      tags: [Admin - Médecins]
      summary: Modifier un médecin (mise à jour partielle)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MedecinPatchRequest'
      responses:
        '200':
          description: Médecin modifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Medecin'
        '400':
          description: Aucun champ à mettre à jour, ou erreur de validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Médecin introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Admin - Médecins]
      summary: Supprimer un médecin
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Médecin supprimé
        '404':
          description: Médecin introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Ce médecin a des rendez-vous ou disponibilités enregistrés
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/specialites:
    post:
      tags: [Admin - Spécialités]
      summary: Créer une spécialité
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpecialiteRequest'
      responses:
        '201':
          description: Spécialité créée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Specialite'
        '400':
          description: Erreur de validation (nom déjà utilisé)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/specialites/{id}:
    patch:
      tags: [Admin - Spécialités]
      summary: Modifier une spécialité (mise à jour partielle)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpecialitePatchRequest'
      responses:
        '200':
          description: Spécialité modifiée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Specialite'
        '400':
          description: Aucun champ à mettre à jour, ou erreur de validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Spécialité introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Admin - Spécialités]
      summary: Supprimer une spécialité
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Spécialité supprimée
        '404':
          description: Spécialité introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Des médecins ont encore cette spécialité
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Token obtenu via /auth/login ou /auth/register, valide 15 jours.
        À envoyer dans l'en-tête `Authorization: Bearer <token>`.

  schemas:
    RegisterRequest:
      type: object
      required: [nom, prenom, email, password]
      properties:
        nom:
          type: string
          example: Dupont
        prenom:
          type: string
          example: Luc
        email:
          type: string
          format: email
          example: luc.dupont@example.com
        password:
          type: string
          format: password
          minLength: 8
          example: password123

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    Patient:
      type: object
      properties:
        id:
          type: integer
          example: 1
        nom:
          type: string
        prenom:
          type: string
        email:
          type: string
          format: email
        admin:
          type: boolean

    AuthResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT signé HS256, valide 15 jours
        patient:
          $ref: '#/components/schemas/Patient'

    Medecin:
      type: object
      properties:
        id:
          type: integer
          example: 1
        nom:
          type: string
          example: Durand
        prenom:
          type: string
          example: Jean
        specialite_id:
          type: integer
          example: 1
        specialite_nom:
          type: string
          example: Généraliste

    Specialite:
      type: object
      properties:
        id:
          type: integer
          example: 1
        nom:
          type: string
          example: Généraliste

    MedecinRequest:
      type: object
      required: [nom, prenom, specialite_id]
      properties:
        nom:
          type: string
          example: Durand
        prenom:
          type: string
          example: Jean
        specialite_id:
          type: integer
          example: 1

    SpecialiteRequest:
      type: object
      required: [nom]
      properties:
        nom:
          type: string
          example: Ophtalmologue

    MedecinPatchRequest:
      type: object
      description: Tous les champs sont optionnels — seuls ceux envoyés sont modifiés.
      properties:
        nom:
          type: string
          example: Durand
        prenom:
          type: string
          example: Jean
        specialite_id:
          type: integer
          example: 1

    SpecialitePatchRequest:
      type: object
      description: Tous les champs sont optionnels — seuls ceux envoyés sont modifiés.
      properties:
        nom:
          type: string
          example: Ophtalmologue

    RendezVousRequest:
      type: object
      required: [medecin_id, date_heure]
      properties:
        medecin_id:
          type: integer
          example: 1
        date_heure:
          type: string
          example: "2026-10-01 10:00:00"

    RendezVous:
      type: object
      properties:
        id:
          type: integer
          example: 1
        patient_id:
          type: integer
          example: 4
        medecin_id:
          type: integer
          example: 1
        date_heure:
          type: string
          example: "2026-10-01 10:00:00"
        statut:
          type: string
          enum: [confirme, annule, honore]
        medecin_nom:
          type: string
          example: Durand
        medecin_prenom:
          type: string
          example: Jean
        specialite_nom:
          type: string
          example: Généraliste
        patient_nom:
          type: string
          description: Présent uniquement sur /admin/rendez-vous
          example: Vigneron
        patient_prenom:
          type: string
          description: Présent uniquement sur /admin/rendez-vous
          example: Luc

    Creneau:
      type: object
      properties:
        date_heure:
          type: string
          example: "2026-10-10 09:30:00"
        disponible:
          type: boolean

    DisponibiliteRequest:
      type: object
      required: [medecin_id, date_dispo, heure_debut, heure_fin, duree_creneau]
      properties:
        medecin_id:
          type: integer
          example: 1
        date_dispo:
          type: string
          example: "2026-10-10"
        heure_debut:
          type: string
          example: "09:00:00"
        heure_fin:
          type: string
          example: "11:00:00"
        duree_creneau:
          type: integer
          description: Durée d'un créneau, en minutes
          example: 30

    Disponibilite:
      type: object
      properties:
        id:
          type: integer
          example: 1
        medecin_id:
          type: integer
          example: 1
        date_dispo:
          type: string
          example: "2026-10-10"
        heure_debut:
          type: string
          example: "09:00:00"
        heure_fin:
          type: string
          example: "11:00:00"
        duree_creneau:
          type: integer
          example: 30

    ErrorResponse:
      type: object
      properties:
        status:
          type: integer
          example: 400
        error:
          type: integer
          example: 400
        messages:
          type: object
          additionalProperties:
            type: string
