openapi: 3.0.3
info:
  title: QualiDoc API
  description: API de prise de rendez-vous médicaux (test technique QualiJob).
  version: "1.0"
servers:
  - url: http://localhost:8080/api
    description: Dev local

tags:
  - name: Auth
    description: Inscription, connexion, token JWT
  - name: Medecins
    description: Recherche de médecins et liste des spécialités
  - name: Admin - Médecins
    description: Créer/modifier/supprimer un médecin (réservé aux comptes admin)
  - name: Admin - Spécialités
    description: Créer/modifier/supprimer une spécialité (réservé aux comptes admin)

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Créer un compte patient
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Compte créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Erreur de validation (email déjà utilisé, champs manquants...)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      tags: [Auth]
      summary: Se connecter et obtenir un token JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Connexion réussie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Identifiants invalides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /me:
    get:
      tags: [Auth]
      summary: Récupérer le profil du patient connecté
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profil du patient
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Patient'
        '401':
          description: Token manquant, invalide ou expiré
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /medecins:
    get:
      tags: [Medecins]
      summary: Rechercher des médecins (nom/prénom + spécialité)
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          description: Recherche plein texte sur nom, prénom et spécialité (préfixe par mot, tous les mots combinés en ET)
          schema:
            type: string
          example: jean dur
      responses:
        '200':
          description: Liste des médecins correspondants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Medecin'
        '401':
          description: Token manquant, invalide ou expiré
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /specialites:
    get:
      tags: [Medecins]
      summary: Lister les spécialités
      responses:
        '200':
          description: Liste des spécialités
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Specialite'

  /admin/medecins:
    post:
      tags: [Admin - Médecins]
      summary: Créer un médecin
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MedecinRequest'
      responses:
        '201':
          description: Médecin créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Medecin'
        '400':
          description: Erreur de validation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Compte non admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/medecins/{id}:
    put:
      tags: [Admin - Médecins]
      summary: Modifier un médecin
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MedecinRequest'
      responses:
        '200':
          description: Médecin modifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Medecin'
        '404':
          description: Médecin introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Admin - Médecins]
      summary: Supprimer un médecin
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Médecin supprimé
        '404':
          description: Médecin introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Ce médecin a des rendez-vous ou disponibilités enregistrés
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/specialites:
    post:
      tags: [Admin - Spécialités]
      summary: Créer une spécialité
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpecialiteRequest'
      responses:
        '201':
          description: Spécialité créée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Specialite'
        '400':
          description: Erreur de validation (nom déjà utilisé)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /admin/specialites/{id}:
    put:
      tags: [Admin - Spécialités]
      summary: Modifier une spécialité
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpecialiteRequest'
      responses:
        '200':
          description: Spécialité modifiée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Specialite'
        '404':
          description: Spécialité introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      tags: [Admin - Spécialités]
      summary: Supprimer une spécialité
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Spécialité supprimée
        '404':
          description: Spécialité introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Des médecins ont encore cette spécialité
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Token obtenu via /auth/login ou /auth/register, valide 15 jours.
        À envoyer dans l'en-tête `Authorization: Bearer <token>`.

  schemas:
    RegisterRequest:
      type: object
      required: [nom, prenom, email, password]
      properties:
        nom:
          type: string
          example: Dupont
        prenom:
          type: string
          example: Luc
        email:
          type: string
          format: email
          example: luc.dupont@example.com
        password:
          type: string
          format: password
          minLength: 8
          example: password123

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password

    Patient:
      type: object
      properties:
        id:
          type: integer
          example: 1
        nom:
          type: string
        prenom:
          type: string
        email:
          type: string
          format: email
        admin:
          type: boolean

    AuthResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT signé HS256, valide 15 jours
        patient:
          $ref: '#/components/schemas/Patient'

    Medecin:
      type: object
      properties:
        id:
          type: integer
          example: 1
        nom:
          type: string
          example: Durand
        prenom:
          type: string
          example: Jean
        specialite_id:
          type: integer
          example: 1
        specialite_nom:
          type: string
          example: Généraliste

    Specialite:
      type: object
      properties:
        id:
          type: integer
          example: 1
        nom:
          type: string
          example: Généraliste

    MedecinRequest:
      type: object
      required: [nom, prenom, specialite_id]
      properties:
        nom:
          type: string
          example: Durand
        prenom:
          type: string
          example: Jean
        specialite_id:
          type: integer
          example: 1

    SpecialiteRequest:
      type: object
      required: [nom]
      properties:
        nom:
          type: string
          example: Ophtalmologue

    ErrorResponse:
      type: object
      properties:
        status:
          type: integer
          example: 400
        error:
          type: integer
          example: 400
        messages:
          type: object
          additionalProperties:
            type: string
